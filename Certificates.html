<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificates | Thavi Naidoo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* GLOBAL */
body {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: #ffffff;
  font-family: 'Segoe UI', sans-serif;
}

/* NAVBAR (🔥 STUNNING UPGRADE) */
.navbar {
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #1e293b;
}

.navbar-brand {
  font-weight: bold;
}

.navbar a {
  color: #ffffff !important;
  transition: 0.3s;
  position: relative;
}

/* 🔥 hover underline animation */
.navbar a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  bottom: -4px;
  left: 0;
  background-color: #38bdf8;
  transition: 0.3s;
}

.navbar a:hover::after {
  width: 100%;
}

.navbar a:hover {
  color: #38bdf8 !important;
}

/* ACTIVE LINK */
.nav-active {
  color: #38bdf8 !important;
}

/* SECTIONS */
.section {
  margin-top: 40px;
}

/* CARD (GLASS EFFECT) */
.card-custom {
  background: rgba(2, 6, 23, 0.7);
  border: 1px solid #1e293b;
  border-radius: 16px;
  padding: 25px;
  backdrop-filter: blur(12px);
}

/* PDF VIEW */
.cert-frame {
  width: 100%;
  height: 350px;
  border-radius: 12px;
  border: none;
  margin-bottom: 20px;
}

/* HEADINGS */
h1, h3 {
  color: #38bdf8;
}

/* IMAGE */
img {
  border-radius: 10px;
  margin-bottom: 20px;
}

/* FOOTER */
footer {
  background-color: #020617;
}

/* OPTIONAL SCROLL SMOOTH */
html {
  scroll-behavior: smooth;
}

</style>
</head>

<body>

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-dark px-4 py-3">
  <span class="navbar-brand">Thavi Naidoo</span>
  <div>
    <a href="index.html" class="me-4">Home</a>
    <a href="#" class="me-4 nav-active">Certificates</a>
    <a href="Projects.html">Projects</a>
  </div>
</nav>

<div class="container">

  <!-- CERTIFICATES -->
  <div class="section">
    <div class="card-custom">

      <h1 class="mb-4">My Certifications</h1>

      <!-- ✅ MAIN CERTIFICATES -->
      <iframe src="cert/cert8.pdf" class="cert-frame"></iframe>
      <iframe src="cert/cert7.pdf" class="cert-frame"></iframe>
      <iframe src="cert/cert6.pdf" class="cert-frame"></iframe>
      <iframe src="cert/cert5.pdf" class="cert-frame"></iframe>

      <!-- IMAGE CERT -->
      <img src="cert/UC-61c4236d-bcfc-40c2-89cf-ead10d534088.jpg" class="img-fluid">

      <!-- ✅ EXTRA CERTS (SCROLLABLE FEEL) -->
      <iframe src="cert/cert4.pdf" class="cert-frame"></iframe>
      <iframe src="cert/cert3.pdf" class="cert-frame"></iframe>
      <iframe src="cert/cert2.pdf" class="cert-frame"></iframe>
      <iframe src="cert/cert1.pdf" class="cert-frame"></iframe>

    </div>
  </div>

  <!-- LICENSE -->
  <div class="section">
    <div class="card-custom">
      <h3>MIT License</h3>
      <p>
        THE SOFTWARE IS PROVIDED “AS IS”, WITHOUT WARRANTY OF ANY KIND,
        EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES
        OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT.
      </p>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer class="text-center text-light py-4 mt-5">
  <p>© 2026 Thavi Naidoo</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
