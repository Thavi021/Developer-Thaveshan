}

.navbar-brand {

.navbar a {
  color: #ffffff !important;
  transition: 0.3s;
  position: relative;
}

.navbar a::after {
  content: "";

  width: 0%;
  height: 2px;
  bottom: -4px;
  left: 0;
  background-color: #38bdf8;

}

.navbar a:hover::after {

  padding: 25px;
  backdrop-filter: blur(12px);
}

/* PDF VIEW */

/* FOOTER */

/* OPTIONAL SCROLL SMOOTH */
html {
  scroll-behavior: smooth;
}
