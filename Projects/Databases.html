<style>

body {
  background-color: #0f172a;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

/* ✅ FORCE ALL TEXT WHITE */
body, table, td, th, p, div, span {
  color: #ffffff !important;
}

/* ✅ TABLE */
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px; /* 🔥 smaller font */
}

/* ✅ SMALL COMPACT CELLS */
td, th {
  border: 1px solid #475569;
  text-align: left;
  padding: 4px 6px;   /* 🔥 MUCH smaller */
  line-height: 1.2;   /* tighter spacing */
}

/* ✅ FORCE SMALL ROW HEIGHT */
tr {
  height: 28px;
}

/* ✅ HEADER */
th {
  background-color: #020617;
}

/* ✅ STRIPES */
tr:nth-child(even) {
  background-color: #020617;
}

/* ✅ HOVER */
tr:hover {
  background-color: #1e293b;
}

/* ✅ FIX IMAGE SIZE (VERY IMPORTANT) */
div.gallery img {
  width: 50px;   /* 🔥 THIS is key */
  height: auto;
}

/* ✅ REMOVE EXTRA IMAGE SPACE */
div.gallery {
  padding: 2px;
  margin: 0;
  border: 1px solid #334155;
}

/* ✅ CLEAN RESPONSIVE */
.responsive {
  width: auto;
  padding: 0;
}

* {
  box-sizing: border-box;
}

</style>
